<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">AI Agent 工程能力图</title>
  <desc id="desc">用户目标经过上下文、模型决策和工具执行形成观察结果，再由验证与经验更新闭环。下方展示知识助手、Coding Agent、交互 Agent 和多 Agent 协作四类应用。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111b20"/><stop offset="1" stop-color="#182a2c"/></linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d8ff75"/><stop offset="1" stop-color="#9bce52"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#071012" flood-opacity=".34"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#78938f"/></marker>
    <style>
      text{font-family:Inter,"Microsoft YaHei",system-ui,sans-serif;fill:#edf4ec}
      .mono{font-family:Consolas,monospace;letter-spacing:2px}
      .muted{fill:#92a5a2}.tiny{font-size:16px}.small{font-size:20px}.label{font-size:18px;font-weight:700}.title{font-size:58px;font-weight:650;letter-spacing:-2px}
      .card{fill:#1d3031;stroke:#3c5553;stroke-width:1}.core{fill:url(#lime)}.dark{fill:#132326}.ink{fill:#162123}
      .line{fill:none;stroke:#78938f;stroke-width:3;marker-end:url(#arrow)}.dash{fill:none;stroke:#5f7976;stroke-width:2;stroke-dasharray:8 9}
    </style>
  </defs>
  <rect width="1600" height="980" rx="34" fill="url(#bg)"/>
  <path d="M0 202H1600M0 705H1600" stroke="#344b49" stroke-width="1"/>
  <text x="80" y="72" class="mono tiny muted">RESEARCH 007 / AGENT ENGINEERING ATLAS</text>
  <text x="80" y="144" class="title">从模型，到可验证的行动。</text>
  <text x="1184" y="71" class="mono tiny muted">SOURCE VERSION</text>
  <text x="1184" y="105" class="mono small">7572c78e</text>
  <text x="1184" y="137" class="tiny muted">AI Agent Book · 2026-09-07</text>

  <g filter="url(#shadow)">
    <rect x="70" y="260" width="210" height="126" rx="18" class="card"/>
    <text x="96" y="293" class="mono tiny muted">INPUT</text>
    <text x="96" y="334" font-size="28" font-weight="650">用户目标</text>
    <text x="96" y="366" class="tiny muted">问题 · 约束 · 交付</text>

    <rect x="373" y="238" width="245" height="170" rx="22" class="card"/>
    <text x="403" y="274" class="mono tiny muted">CONTEXT</text>
    <text x="403" y="318" font-size="30" font-weight="650">上下文</text>
    <text x="403" y="354" class="tiny muted">指令 · 历史 · 记忆</text>
    <text x="403" y="381" class="tiny muted">检索结果 · 工具描述</text>

    <circle cx="800" cy="323" r="112" class="core"/>
    <text x="800" y="300" text-anchor="middle" class="mono tiny ink">DECISION</text>
    <text x="800" y="350" text-anchor="middle" font-size="46" font-weight="750" class="ink">LLM</text>
    <text x="800" y="382" text-anchor="middle" class="tiny ink">理解 · 规划 · 选择</text>

    <rect x="982" y="238" width="245" height="170" rx="22" class="card"/>
    <text x="1012" y="274" class="mono tiny muted">ACTION</text>
    <text x="1012" y="318" font-size="30" font-weight="650">工具</text>
    <text x="1012" y="354" class="tiny muted">搜索 · 代码 · API</text>
    <text x="1012" y="381" class="tiny muted">浏览器 · 语音 · 设备</text>

    <rect x="1320" y="260" width="210" height="126" rx="18" class="card"/>
    <text x="1346" y="293" class="mono tiny muted">OUTPUT</text>
    <text x="1346" y="334" font-size="28" font-weight="650">环境事实</text>
    <text x="1346" y="366" class="tiny muted">结果 · 错误 · 状态</text>
  </g>

  <path d="M280 323H360" class="line"/><path d="M618 323H674" class="line"/><path d="M912 323H969" class="line"/><path d="M1227 323H1307" class="line"/>
  <path d="M1425 404C1425 555 800 575 800 450" class="line"/>
  <text x="1123" y="522" text-anchor="middle" class="tiny muted">观察结果回填 → 继续决策</text>

  <rect x="373" y="492" width="854" height="126" rx="20" fill="#152628" stroke="#3c5553"/>
  <text x="405" y="529" class="mono tiny" fill="#bde567">HARNESS / 工程控制层</text>
  <g transform="translate(405 550)">
    <rect width="135" height="42" rx="21" fill="#243b3b"/><text x="67" y="27" text-anchor="middle" class="tiny">权限</text>
    <rect x="151" width="135" height="42" rx="21" fill="#243b3b"/><text x="218" y="27" text-anchor="middle" class="tiny">状态</text>
    <rect x="302" width="135" height="42" rx="21" fill="#243b3b"/><text x="369" y="27" text-anchor="middle" class="tiny">预算</text>
    <rect x="453" width="135" height="42" rx="21" fill="#243b3b"/><text x="520" y="27" text-anchor="middle" class="tiny">错误恢复</text>
    <rect x="604" width="210" height="42" rx="21" fill="#d8ff75"/><text x="709" y="27" text-anchor="middle" class="tiny ink" font-weight="700">验证与终止</text>
  </g>
  <path d="M495 408V480M800 436V480M1104 408V480" class="dash"/>

  <text x="76" y="672" class="mono tiny muted">CAPABILITY COMBINATIONS / 能力组合</text>
  <g transform="translate(70 748)">
    <g>
      <rect width="345" height="158" rx="18" class="card"/>
      <circle cx="39" cy="39" r="17" fill="#d8ff75"/><text x="39" y="45" text-anchor="middle" class="tiny ink" font-weight="700">1</text>
      <text x="70" y="46" class="label">知识助手</text>
      <text x="28" y="90" class="tiny muted">混合检索 · 用户记忆 · 引用</text>
      <text x="28" y="125" class="small">找到依据，跨会话记住</text>
    </g>
    <g transform="translate(372)">
      <rect width="345" height="158" rx="18" class="card"/>
      <circle cx="39" cy="39" r="17" fill="#d8ff75"/><text x="39" y="45" text-anchor="middle" class="tiny ink" font-weight="700">2</text>
      <text x="70" y="46" class="label">Coding Agent</text>
      <text x="28" y="90" class="tiny muted">文件工具 · 终端 · 测试</text>
      <text x="28" y="125" class="small">修改代码，用环境验收</text>
    </g>
    <g transform="translate(744)">
      <rect width="345" height="158" rx="18" class="card"/>
      <circle cx="39" cy="39" r="17" fill="#d8ff75"/><text x="39" y="45" text-anchor="middle" class="tiny ink" font-weight="700">3</text>
      <text x="70" y="46" class="label">交互 Agent</text>
      <text x="28" y="90" class="tiny muted">异步 · 语音 · GUI · 设备</text>
      <text x="28" y="125" class="small">感知事件，改变环境</text>
    </g>
    <g transform="translate(1116)">
      <rect width="345" height="158" rx="18" class="card"/>
      <circle cx="39" cy="39" r="17" fill="#d8ff75"/><text x="39" y="45" text-anchor="middle" class="tiny ink" font-weight="700">4</text>
      <text x="70" y="46" class="label">多 Agent</text>
      <text x="28" y="90" class="tiny muted">分工 · 隔离 · 消息 · 审核</text>
      <text x="28" y="125" class="small">并行工作，独立验证</text>
    </g>
  </g>
  <text x="80" y="949" class="tiny muted">原创研究图 · 依据固定版本公开文档与关键源码重新组织 · 非上游产品截图</text>
</svg>
