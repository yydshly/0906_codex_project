<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1460" viewBox="0 0 1600 1460" role="img" aria-labelledby="title desc">
<title id="title">Claudish to English 完整能力架构图</title><desc id="desc">两条输入路径通过钩子进入提示词与模型改写，分别输出屏幕文字和 Markdown 文件。语言、表达、后端与运行控制可配置。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#66758d" stroke-width="1.5"/></marker></defs>
<style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#20324c}.title{font-size:40px;font-weight:700}.sub{font-size:21px;fill:#607088}.h{font-size:24px;font-weight:700}.body{font-size:21px}.small{font-size:18px;fill:#607088}.section{font-size:18px;fill:#516781;font-weight:700;letter-spacing:2px}</style>
<rect width="1600" height="1460" fill="#f4f7fb"/>
<text x="52" y="62" class="title">Claudish to English｜完整能力架构</text>
<text x="52" y="102" class="sub">通过钩子接收内容，再由模型按语言与表达规则改写；同时支持屏幕回答与 Markdown 文档。</text>
<text x="52" y="141" class="small">原创源码说明图 · v0.9.0 / bf271f9 · 非产品截图 · 未调用模型实测</text>
<text x="52" y="190" class="section">01  输入与触发：两条独立路径</text>
<rect x="52" y="209" width="728" height="160" rx="16" fill="#eaf2ff" stroke="#b9cfee"/>
<text x="76" y="248" class="h">A  屏幕回答｜MessageDisplay</text>
<text x="76" y="285" class="body">接收 Claude 回答片段 → 按会话与消息缓存</text>
<text x="76" y="316" class="body">完整回答到齐后调用一次；不先用程序提取核心内容</text>
<text x="76" y="347" class="body">原始会话记录保留原文</text>
<rect x="820" y="209" width="728" height="160" rx="16" fill="#eaf7f0" stroke="#badcca"/>
<text x="844" y="248" class="h">B  文档写入｜PostToolUse · Write / Edit</text>
<text x="844" y="285" class="body">默认关闭；启用后仅处理指定目录内的 .md 文件</text>
<text x="844" y="316" class="body">检查文件范围与重复标记 → 暂存 YAML 元数据</text>
<text x="844" y="347" class="body">这是文件处理路径，会实际写入磁盘</text>
<path d="M700 369 L700 419" stroke="#66758d" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M1184 369 L1184 419" stroke="#66758d" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="52" y="406" class="section">02  提示词：语言与表达可以组合，文档有独立规则</text>
<rect x="52" y="429" width="472" height="182" rx="16" fill="#fff" stroke="#dbe3ef"/>
<text x="76" y="468" class="h">语言｜用什么语言说</text>
<text x="76" y="505" class="body">默认跟随输入或宿主语言设置</text>
<text x="76" y="536" class="body">显式指定中文、英文等目标语言</text>
<text x="76" y="567" class="body">可以组合：中文＋摘要／通俗表达</text>
<rect x="564" y="429" width="472" height="182" rx="16" fill="#fff" stroke="#dbe3ef"/>
<text x="588" y="468" class="h">表达｜怎么说</text>
<text x="588" y="505" class="body">默认：短句、日常词汇，保留信息</text>
<text x="588" y="536" class="body">屏幕预设：摘要 / 儿童解释 / 极简</text>
<text x="588" y="567" class="body">摘要允许省略次要细节和代码块</text>
<rect x="1076" y="429" width="472" height="182" rx="16" fill="#fff" stroke="#dbe3ef"/>
<text x="1100" y="468" class="h">自定义｜按自己的要求说</text>
<text x="1100" y="505" class="body">屏幕、Markdown 各有提示词文件</text>
<text x="1100" y="536" class="body">覆盖基础规则及已附加的语言要求</text>
<text x="1100" y="567" class="body">需自行写全语言、保真和输出要求</text>
<rect x="52" y="627" width="1496" height="66" rx="16" fill="#e9edf5" stroke="#dbe3ef"/>
<text x="76" y="654" class="body">默认约束：保留事实、数字、名称、路径与代码；只输出改写正文。</text>
<text x="76" y="681" class="small">屏幕额外语境：最近用户问题（有则附加）＋说话者关系；不让改写模型重新回答问题。</text>
<path d="M800 693 L800 738" stroke="#66758d" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="52" y="730" class="section">03  模型后端：真正执行翻译、换词、拆句和摘要</text>
<rect x="52" y="751" width="1496" height="172" rx="16" fill="#243b59" stroke="#243b59"/>
<text x="76" y="788" style="font-size:24px;font-weight:700;fill:white">统一调用：改写指令 sys ＋ 完整材料 → 模型生成新文本</text>
<rect x="76" y="807" width="345" height="91" rx="16" fill="#fff" stroke="#fff"/>
<text x="92" y="841" class="h">Ollama</text>
<text x="92" y="875" class="small">默认本地模型；可配置地址</text>
<rect x="443" y="807" width="345" height="91" rx="16" fill="#fff" stroke="#fff"/>
<text x="459" y="841" class="h">Codex CLI</text>
<text x="459" y="875" class="small">使用 CLI 自身登录与模型</text>
<rect x="810" y="807" width="345" height="91" rx="16" fill="#fff" stroke="#fff"/>
<text x="826" y="841" class="h">Anthropic</text>
<text x="826" y="875" class="small">API；可选非官方登录复用</text>
<rect x="1177" y="807" width="345" height="91" rx="16" fill="#fff" stroke="#fff"/>
<text x="1193" y="841" class="h">OpenAI 兼容接口</text>
<text x="1193" y="875" class="small">接入本地服务或远端模型</text>
<path d="M416 923 L416 971" stroke="#66758d" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M1184 923 L1184 971" stroke="#66758d" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="52" y="955" class="section">04  输出：分别回到显示或文件路径</text>
<rect x="52" y="985" width="728" height="160" rx="16" fill="#eaf2ff" stroke="#b9cfee"/>
<text x="76" y="1024" class="h">A  回答展示</text>
<text x="76" y="1061" class="body">append：原文流式显示完成后，追加改写版</text>
<text x="76" y="1092" class="body">replace：等待改写后仅显示新文本</text>
<text x="76" y="1123" class="body">/claudish last：重新显示最近原回答</text>
<rect x="820" y="985" width="728" height="160" rx="16" fill="#eaf7f0" stroke="#badcca"/>
<text x="844" y="1024" class="h">B  Markdown 保存</text>
<text x="844" y="1061" class="body">sibling：生成 NAME.plain.md，可自定义后缀</text>
<text x="844" y="1092" class="body">overwrite：覆盖原文件并写入已处理标记</text>
<text x="844" y="1123" class="body">恢复 YAML 元数据；临时文件写好后再替换</text>
<text x="52" y="1182" class="section">05  贯穿流程的控制与保护</text>
<rect x="52" y="1200" width="728" height="147" rx="16" fill="#fff" stroke="#dbe3ef"/>
<text x="76" y="1239" class="h">运行控制｜/claudish ＋配置</text>
<text x="76" y="1276" class="body">开关、显示、风格、语言、模型切换；cycle / reset</text>
<text x="76" y="1307" class="body">面板显示配置来源；覆盖项跨会话保留并提醒</text>
<rect x="820" y="1200" width="728" height="147" rx="16" fill="#fff" stroke="#dbe3ef"/>
<text x="844" y="1239" class="h">调用与故障处理</text>
<text x="844" y="1276" class="body">长度门槛、超时、部分后端推理强度；失败回退</text>
<text x="844" y="1307" class="body">截断结果丢弃、一次性通知、DEBUG 日志、STUB 测试</text>
<rect x="52" y="1366" width="1496" height="54" rx="16" fill="#fff3df" stroke="#e7d3ad"/>
<text x="76" y="1400" class="body">能力边界：保真主要依赖提示词；没有自动事实核验、专用简化模型或 RAG。风格预设主要用于屏幕回答。</text>
<text x="52" y="1445" class="small">来源：固定提交的 README、hooks、rewrite、rewrite-md、providers、lang 与 claudish-ctl。研究日期：2026-09-07。</text>
</svg>