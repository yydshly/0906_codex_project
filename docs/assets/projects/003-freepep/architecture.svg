<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1210" viewBox="0 0 1200 1210" role="img" aria-labelledby="title desc">
  <title id="title">FreePEP 收录哪些教材？</title>
  <desc id="desc">FreePEP 收录人教社教材目录780条。普通教育包括六三学制214条、五四学制53条、高中107条；特殊教育包括聋校109条、盲校低视力版132条、盲校盲文版105条、培智学校60条。支持按学段、学科、年级筛选，批量下载为PDF。数量基于查阅版本的目录缓存。</desc>
