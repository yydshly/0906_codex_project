<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1230" viewBox="0 0 1440 1230" role="img" aria-labelledby="title desc">
<title id="title">Prettymaps：源库能力与产品扩展基座</title><desc id="desc">从真实 OSM 数据到程序绘图；已完成地图作品验证。未来增加分析、编辑和自然语言入口，支撑内容、旅行、策划与设计。虚线框表示待建设能力。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#667f78" stroke-width="1.5"/></marker></defs>
<rect width="1440" height="1230" fill="#f6f4ed"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="50" y="48" font-size="18" fill="#7a8579" font-weight="400">006 / PRETTYMAPS · 研究引导</text><text x="50" y="102" font-size="39" fill="#29453f" font-weight="600">真实空间数据，如何成为一系列产品的基础？</text><text x="50" y="144" font-size="22" fill="#29453f" font-weight="400">源库负责地图绘制；我们通过实测理解它，再逐步增加分析、编辑和产品能力。</text><text x="50" y="196" font-size="23" fill="#29453f" font-weight="600">01  源库能力 · 已有基础</text><rect x="50" y="218" width="365" height="206" rx="18" fill="#ffffff" stroke="#becdc5" stroke-width="2" /><text x="74" y="258" font-size="24" fill="#29453f" font-weight="600">OSM 真实地理数据</text><text x="74" y="296" font-size="19" fill="#29453f" font-weight="400">道路与建筑轮廓</text><text x="74" y="327" font-size="19" fill="#29453f" font-weight="400">水域、公园、地标名称与标签</text><text x="74" y="358" font-size="19" fill="#29453f" font-weight="400">是结构化数据，不只是一张图片</text><text x="74" y="389" font-size="19" fill="#29453f" font-weight="400">覆盖程度随地区与标签而变化</text><rect x="462" y="218" width="465" height="206" rx="18" fill="#e3ece4" stroke="#becdc5" stroke-width="2" /><text x="486" y="258" font-size="24" fill="#29453f" font-weight="600">prettymaps 获取、处理与绘制</text><text x="486" y="296" font-size="19" fill="#29453f" font-weight="400">OSMnx：按区域、图层和标签获取</text><text x="486" y="327" font-size="19" fill="#29453f" font-weight="400">Shapely 等：几何处理、裁剪与缓冲</text><text x="486" y="358" font-size="19" fill="#29453f" font-weight="400">Matplotlib：颜色、线宽、纹理、构图</text><text x="486" y="389" font-size="19" fill="#29453f" font-weight="400">按明确参数绘图；不原生理解用户意图</text><rect x="975" y="218" width="415" height="206" rx="18" fill="#ffffff" stroke="#becdc5" stroke-width="2" /><text x="999" y="258" font-size="24" fill="#29453f" font-weight="600">地图作品输出</text><text x="999" y="296" font-size="19" fill="#29453f" font-weight="400">地图图层可选择、样式可定制</text><text x="999" y="327" font-size="19" fill="#29453f" font-weight="400">保存 PNG / SVG 等格式</text><text x="999" y="358" font-size="19" fill="#29453f" font-weight="400">支持 GPX/KML 轨迹输入</text><text x="999" y="389" font-size="19" fill="#29453f" font-weight="400">不是导航或完整规划设计系统</text><path d="M419,321 L454,321" stroke="#667f78" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M932,321 L967,321" stroke="#667f78" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="50" y="477" font-size="23" fill="#29453f" font-weight="600">02  本项目验证 · 真实成品与补充工程</text><rect x="50" y="500" width="1340" height="150" rx="18" fill="#fff7e7" stroke="#becdc5" stroke-width="2" /><text x="74" y="540" font-size="24" fill="#29453f" font-weight="600">西湖 13 张 + 西安 5 张 = 18 张本地成品与效果对照</text><text x="74" y="578" font-size="19" fill="#29453f" font-weight="400">已完成：街区介绍、纪念版式、文章配图、图层与样式对照；西湖支持本地修改参数重新出图。</text><text x="74" y="609" font-size="19" fill="#29453f" font-weight="400">我们补充：数据快照、中文排版、地标编号、网页和生成记录。骑行 GPX 为策划示例，非实骑记录。</text><path d="M720,657 L720,686" stroke="#667f78" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="50" y="717" font-size="23" fill="#29453f" font-weight="600">03  后续共享基座 · 虚线框均为待建设方向</text><rect x="50" y="740" width="420" height="155" rx="18" fill="#ffffff" stroke="#becdc5" stroke-width="2" stroke-dasharray="8 6"/><text x="74" y="780" font-size="24" fill="#29453f" font-weight="600">数据与空间分析</text><text x="74" y="818" font-size="19" fill="#29453f" font-weight="400">数据质量、业务数据接入</text><text x="74" y="849" font-size="19" fill="#29453f" font-weight="400">过滤、距离、路线与覆盖计算</text><rect x="510" y="740" width="420" height="155" rx="18" fill="#ffffff" stroke="#becdc5" stroke-width="2" stroke-dasharray="8 6"/><text x="534" y="780" font-size="24" fill="#29453f" font-weight="600">内容编辑与方案管理</text><text x="534" y="818" font-size="19" fill="#29453f" font-weight="400">点位、轨迹、照片、区域编辑</text><text x="534" y="849" font-size="19" fill="#29453f" font-weight="400">模板保存、撤销、方案比较</text><rect x="970" y="740" width="420" height="155" rx="18" fill="#ffffff" stroke="#becdc5" stroke-width="2" stroke-dasharray="8 6"/><text x="994" y="780" font-size="24" fill="#29453f" font-weight="600">大模型操作入口</text><text x="994" y="818" font-size="19" fill="#29453f" font-weight="400">理解需求 → 配置 → 校验执行</text><text x="994" y="849" font-size="19" fill="#29453f" font-weight="400">预览修改；计算与绘图交给工具</text><path d="M720,905 L720,937" stroke="#667f78" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="50" y="970" font-size="23" fill="#29453f" font-weight="600">04  产品价值 · 共享基础能力，各自补充业务规则与数据</text><rect x="50" y="991" width="314" height="112" rx="18" fill="#ffffff" stroke="#becdc5" stroke-width="2" stroke-dasharray="8 6"/><text x="74" y="1031" font-size="24" fill="#29453f" font-weight="600">内容创作</text><text x="74" y="1069" font-size="19" fill="#29453f" font-weight="400">城市文章、主题配图</text><rect x="392" y="991" width="314" height="112" rx="18" fill="#ffffff" stroke="#becdc5" stroke-width="2" stroke-dasharray="8 6"/><text x="416" y="1031" font-size="24" fill="#29453f" font-weight="600">个人记忆</text><text x="416" y="1069" font-size="19" fill="#29453f" font-weight="400">旅行档案、骑行纪念</text><rect x="734" y="991" width="314" height="112" rx="18" fill="#ffffff" stroke="#becdc5" stroke-width="2" stroke-dasharray="8 6"/><text x="758" y="1031" font-size="24" fill="#29453f" font-weight="600">活动与探索</text><text x="758" y="1069" font-size="19" fill="#29453f" font-weight="400">研学、任务、游览策划</text><rect x="1076" y="991" width="314" height="112" rx="18" fill="#ffffff" stroke="#becdc5" stroke-width="2" stroke-dasharray="8 6"/><text x="1100" y="1031" font-size="24" fill="#29453f" font-weight="600">分析与设计</text><text x="1100" y="1069" font-size="19" fill="#29453f" font-weight="400">覆盖比较、空间概念、游戏</text><text x="50" y="1152" font-size="23" fill="#29453f" font-weight="600">推进：主题地图编辑 → 第二场景复用 → 自然语言操作 → 按需加入分析与方案比较</text><text x="50" y="1193" font-size="17" fill="#6d7972" font-weight="400">原创研究架构图 · 2026-09-07 · 扩展非源库承诺，非市场收益验证；源库版本、许可证与数据来源见研究记录。</text></g></svg>
