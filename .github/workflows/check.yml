name: Check research catalog

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate catalog and generated pages
        run: npm run check
      - name: Validate Multica teaching simulation
        run: node projects/004-multica/tests/simulation.test.mjs
      - name: Install Room Life dependencies
        run: npm ci --prefix projects/005-room-life
      - name: Validate Room Life character and interaction
        run: npm test --prefix projects/005-room-life
      - name: Build Room Life demo and validate record links
        run: npm run build --prefix projects/005-room-life
